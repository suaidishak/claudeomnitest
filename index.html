<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="A clean, fast tic tac toe game for two players or against the computer.">
  <title>Tic Tac Toe</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="app">
    <header class="app__header">
      <h1>Tic Tac Toe</h1>
      <p class="subtitle">Play a friend — or take on a computer that never loses.</p>
    </header>

    <div class="mode-switch" role="group" aria-label="Game mode">
      <button type="button" class="mode-switch__btn is-active" data-mode="pvp" aria-pressed="true">Two players</button>
      <button type="button" class="mode-switch__btn" data-mode="ai" aria-pressed="false">Vs computer</button>
    </div>

    <section class="scoreboard" aria-label="Scoreboard">
      <div class="score score--x">
        <span class="score__label" id="label-x">Player X</span>
        <span class="score__value" id="score-x">0</span>
      </div>
      <div class="score score--draw">
        <span class="score__label">Draws</span>
        <span class="score__value" id="score-draw">0</span>
      </div>
      <div class="score score--o">
        <span class="score__label" id="label-o">Player O</span>
        <span class="score__value" id="score-o">0</span>
      </div>
    </section>

    <p class="status" id="status" role="status" aria-live="polite">X's turn</p>

    <div class="board" id="board" aria-label="Tic tac toe board"></div>

    <div class="actions">
      <button type="button" class="btn btn--primary" id="new-round">New round</button>
      <button type="button" class="btn btn--ghost" id="reset-scores">Reset scores</button>
    </div>
  </main>

  <script src="game.js"></script>
</body>
</html>
